<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>NDT Platform - Tejas Infra Solutions</title>
<style>/* NDT Platform - Tejas Infra Solutions. Black and red theme. */
:root{--bg:#0b0b0d;--bg2:#151518;--bg3:#1d1d22;--bg4:#26262c;--line:#2c2c33;--ink:#ececf1;--ink2:#a3a3ae;
--red:#e53935;--red2:#b71c1c;--redink:#ff6a60;--navy:#ff6a60;--navy2:#2a1416;--gold:#ff5a50;
--ok:rgba(76,175,80,.16);--okb:#7fd88b;--warn:rgba(255,160,0,.15);--warnb:#ffbe55;--fail:rgba(244,67,54,.18);--failb:#ff8077;
--err:rgba(244,67,54,.32);--info:rgba(66,165,245,.14);--infob:#79bdf7;--paper:#fbfbfc;--paperink:#1d2433}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--redink);text-decoration:none;cursor:pointer} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--ink);padding:8px 14px;
  transition:background .15s,border-color .15s}
button:hover{border-color:var(--red);background:var(--bg4)}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.primary:hover{background:var(--red2);border-color:var(--red2)}
button.run{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:600}
button.danger{color:var(--failb);border-color:#5a2420;background:transparent}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg3);color:var(--ink);width:100%}
input::placeholder{color:#6d6d78}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(229,57,53,.35);border-color:var(--red)}
input:disabled,select:disabled{opacity:.45}
select option{background:var(--bg3);color:var(--ink)}
label{display:block;font-size:12px;color:var(--ink2);margin:7px 0 3px}
/* header */
header.top{background:#000;color:#fff;display:flex;align-items:center;gap:14px;padding:9px 18px;position:sticky;top:0;z-index:20;
  flex-wrap:wrap;border-bottom:3px solid var(--red)}
header.top .brand{font:800 20px "Segoe UI",Arial,sans-serif;letter-spacing:.4px;cursor:pointer;white-space:nowrap}
header.top .brand b{color:var(--red)}
header.top .co{color:var(--ink2);font:italic 600 13px "Segoe UI",Arial,sans-serif}
header.top nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
header.top nav a{color:#d4d4dc;padding:7px 11px;border-radius:8px;font-weight:500}
header.top nav a.on,header.top nav a:hover{background:#1f0d0e;color:#fff;text-decoration:none;box-shadow:inset 0 -2px 0 var(--red)}
header.top select{width:auto;padding:4px 8px;background:#111;border-color:#333}
.menu-btn{display:none;margin-left:auto;background:#111;border-color:#333;font-size:18px;padding:4px 12px}
main{max-width:1320px;margin:0 auto;padding:18px 18px 70px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px}
.card h2,.card h3{margin:0 0 10px;color:var(--ink)}
.card h3::before{content:"";display:inline-block;width:4px;height:15px;background:var(--red);border-radius:2px;margin-right:8px;vertical-align:-2px}
.card.paper{background:var(--paper);color:var(--paperink);border-color:#e3e3e8}
h1{color:var(--ink);font-size:23px;margin:4px 0 14px;font-weight:700}
h1::after{content:"";display:block;width:46px;height:3px;background:var(--red);border-radius:2px;margin-top:6px}
.muted{color:var(--ink2)} .small{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px}
.grid .wide{grid-column:1/-1}
.crumb{color:var(--ink2);margin-bottom:6px} .crumb a{font-weight:600}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 14px}
.tabs a{padding:9px 14px;color:var(--ink2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:#fff;border-bottom-color:var(--red)} .tabs a:hover{color:#fff;text-decoration:none}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#202026;color:#fff;text-align:left;padding:8px 9px;white-space:nowrap;position:sticky;top:0;font-weight:600;border-bottom:2px solid var(--red2)}
td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
.card.paper th{background:#2b2b31} .card.paper td{border-color:#e6e6ea}
tr.click{cursor:pointer} tr.click:hover td{background:#22191a}
tr.ok td{background:var(--ok)} tr.warn td{background:var(--warn)} tr.fail td{background:var(--fail)}
tr.error td{background:var(--err)} tr.info td{background:var(--info)}
.lv{border-radius:9px;padding:8px 11px;margin:5px 0;border-left:3px solid transparent}
.lv.ok{background:var(--ok);border-color:var(--okb)} .lv.warn{background:var(--warn);border-color:var(--warnb)}
.lv.fail{background:var(--fail);border-color:var(--failb)} .lv.error{background:var(--err);border-color:var(--failb)}
.lv.info{background:var(--info);border-color:var(--infob)}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;background:#26262d;color:#e2e2ea}
.chip.ok{background:var(--ok);color:var(--okb)} .chip.warn{background:var(--warn);color:var(--warnb)}
.chip.fail,.chip.error{background:var(--fail);color:var(--failb)} .chip.red{background:var(--red);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 10px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:14px;max-width:980px;width:100%;
  padding:18px 20px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.modal .box h3{margin:0 0 8px;color:#fff}
.split{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:14px}
.readings{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.instant{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:62vh;overflow:auto}
.instant .k{font-weight:600}
.step{font-family:Consolas,monospace;font-size:12px;color:#d6d6de;margin:2px 0 0 14px}
.ref{font-size:11px;color:var(--infob);font-style:italic;margin-left:14px}
.fig{text-align:center} .fig img{max-width:100%;max-height:260px;background:#fff;border-radius:8px;padding:4px}
.hint{color:var(--infob);font-style:italic;font-size:12px;margin:6px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b1b1f;border:1px solid var(--red);color:#fff;
  padding:11px 18px;border-radius:11px;z-index:90;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.center{max-width:430px;margin:30px auto}
.chartbox{position:relative;height:340px} .chartbox.small{height:220px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:12px}
details summary{cursor:pointer;font-weight:600;color:var(--redink);margin:4px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #3a3a42;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.right{margin-left:auto}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px}
.footer{color:var(--ink2);font-size:12px;text-align:center;margin-top:20px}
/* sign-in pages */
.auth{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,460px);min-height:calc(100vh - 0px);margin:-18px -18px -70px}
.auth-hero{position:relative;overflow:hidden;background:#000;min-height:520px}
.auth-hero .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;background-size:cover;background-position:center}
.auth-hero .slide.on{opacity:1}
.auth-hero .slide svg{width:100%;height:100%;display:block}
.auth-hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.15),rgba(0,0,0,.55) 70%,#0b0b0d);pointer-events:none}
.auth-hero .cap{position:absolute;left:34px;bottom:34px;right:34px;color:#fff;text-shadow:0 2px 10px #000}
.auth-hero .cap .t{font:800 34px "Segoe UI",Arial,sans-serif;line-height:1.15} .auth-hero .cap .t b{color:var(--red)}
.auth-hero .cap .s{color:#d0d0d8;margin-top:8px;font-size:15px;max-width:560px}
.auth-hero .dots{position:absolute;left:34px;top:26px;display:flex;gap:6px}
.auth-hero .dots i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)} .auth-hero .dots i.on{background:var(--red)}
.auth-side{display:flex;flex-direction:column;justify-content:center;padding:36px 34px;background:var(--bg)}
.auth-brand{font:800 26px "Segoe UI",Arial,sans-serif;letter-spacing:.3px} .auth-brand b{color:var(--red)}
.auth-by{color:var(--ink2);font-size:13px;margin-bottom:22px}
.who{display:flex;align-items:center;gap:10px;min-height:46px;margin:2px 0 8px;padding:6px 10px;border-radius:10px;background:transparent;
  transition:background .2s} .who.on{background:var(--bg3);border:1px solid var(--line)}
.who img{height:34px;max-width:90px;border-radius:5px;background:#fff;padding:2px} .who .n{font-weight:700;font-size:16px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border-color:#fff;font-weight:600}
.gbtn:hover{background:#f1f1f1;border-color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:12px;margin:12px 0} .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.kpi .v{font-size:30px;font-weight:800} .kpi .l{color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:14px}
.ccard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ccard .h{display:flex;align-items:center;gap:10px} .ccard .h img{height:34px;max-width:80px;border-radius:5px;background:#fff;padding:2px}
.ccard .h .n{font-weight:700;font-size:17px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mini div{background:var(--bg3);border-radius:10px;padding:7px} .mini b{display:block;font-size:20px} .mini span{font-size:11px;color:var(--ink2)}
.bar{height:8px;border-radius:5px;background:#2a2a31;overflow:hidden} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red))}
.bar.done i{background:#43a047}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px 46px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.prow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .prow .t b{color:#fff}
.stages{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.stages span{font-size:10.5px;padding:1px 7px;border-radius:10px;background:#26262d;color:#8d8d98} .stages span.d{background:rgba(76,175,80,.18);color:var(--okb)}
.stages span.n{background:var(--red);color:#fff}
/* concrete mix design */
.mixwrap{display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:14px;align-items:start}
.mxin{position:sticky;top:66px;max-height:calc(100vh - 78px);overflow:auto}
.mxin .grid{grid-template-columns:1fr;gap:0}
.mxg h4{margin:14px 0 0;color:var(--redink);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.tile .v{font-size:19px;font-weight:700;color:#fff} .tile .l{font-size:12px;color:var(--ink2)}
input.bad{border-color:var(--failb);background:#2a1414}
.mxout .charts{grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr))}
/* photos, scans and the zoomable viewer */
.zv{position:relative;height:46vh;min-height:240px;overflow:hidden;background:#000;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:grab}
.zv img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.zvb{position:absolute;right:8px;top:8px;display:flex;gap:5px;z-index:2} .zvb button{padding:5px 11px;background:rgba(20,20,24,.85)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.thumb{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.thumb:hover{border-color:var(--red)} .thumb .ti{height:130px;display:flex;align-items:center;justify-content:center;background:#000}
.thumb .ti img{width:100%;height:100%;object-fit:cover} .thumb .tc{padding:8px 10px;font-size:13px}
.thumb .pdf{font-weight:800;color:var(--red);font-size:22px}
#sgrid td{padding:4px 5px} #sgrid select,#sgrid input{font-size:13px}
/* phones and small tablets */
@media (max-width:900px){
  .mixwrap{grid-template-columns:minmax(0,1fr)} .mxin{position:static!important;max-height:none!important}
  .auth{grid-template-columns:1fr;margin:-12px -10px -70px} .auth-hero{min-height:230px} .auth-hero .cap .t{font-size:24px}
  .auth-hero .cap{left:18px;right:18px;bottom:16px} .auth-hero .cap .s{display:none} .auth-side{padding:22px 18px 40px}
}
@media (max-width:820px){
  .split{grid-template-columns:1fr} main{padding:12px 10px 80px}
  .menu-btn{display:block} header.top{padding:8px 12px;gap:8px} header.top .co{display:none}
  header.top nav{display:none;width:100%;flex-direction:column;margin:4px 0 2px} header.top nav.open{display:flex}
  header.top nav a{padding:11px 12px;font-size:15px;border-bottom:1px solid #1d1d22}
  .readings{grid-template-columns:repeat(5,minmax(0,1fr))} button{padding:10px 14px}
  .prow{grid-template-columns:minmax(0,1fr) 70px 40px}
}
@media (max-width:520px){.charts{grid-template-columns:1fr} h1{font-size:20px} .kpi .v{font-size:24px}}
</style>

<script>/* Impact Lab NDT engine - JavaScript port of ndt/{codes,calc,halfcell,carbonation,cover,trace}.py and
   impactlab/{analysis,instant,compare}.py. It must give exactly the same numbers and texts as the Python engine:
   tools/test_cloud.py runs both on the same data and compares every row, check, step and statistic.
   Software designed by Tejas Infra Solutions. */
var ILEngine = (function () {
  "use strict";

  // =============================================================== Python-compatible number helpers
  function fsum(arr) {  // math.fsum (Shewchuk), as used by statistics.fmean
    var partials = [];
    for (var k = 0; k < arr.length; k++) {
      var x = arr[k], i = 0;
      for (var j = 0; j < partials.length; j++) {
        var y = partials[j];
        if (Math.abs(x) < Math.abs(y)) { var t = x; x = y; y = t; }
        var hi = x + y, lo = y - (hi - x);
        if (lo) partials[i++] = lo;
        x = hi;
      }
      partials.length = i;
      partials.push(x);
    }
    var n = partials.length, h = 0, l = 0;
    if (n > 0) {
      h = partials[--n];
      while (n > 0) {
        var xx = h, yy = partials[--n];
        h = xx + yy;
        var yr = h - xx;
        l = yy - yr;
        if (l !== 0) break;
      }
      if (n > 0 && ((l < 0 && partials[n - 1] < 0) || (l > 0 && partials[n - 1] > 0))) {
        var y2 = l * 2, x2 = h + y2, yr2 = x2 - h;
        if (y2 === yr2) h = x2;
      }
    }
    return h;
  }
  function fmean(a) { return fsum(a) / a.length; }
  function sumPlain(a) {  // Python 3.12 builtin sum() of floats: Neumaier compensated summation (CPython bltinmodule.c)
    if (!a.length) return 0;
    var f = 0 + a[0], c = 0.0;
    for (var i = 1; i < a.length; i++) {
      var x = a[i], t = f + x;
      if (Math.abs(f) >= Math.abs(x)) c += (f - t) + x; else c += (x - t) + f;
      f = t;
    }
    if (c && isFinite(c)) f += c;
    return f;
  }
  // statistics.stdev / pstdev: exact sum of squares (Python uses Fractions) and a correctly rounded square root
  function toFrac(x) {  // x = mant * 2^exp exactly
    var dv = new DataView(new ArrayBuffer(8));
    dv.setFloat64(0, x);
    var hi = dv.getUint32(0), lo = dv.getUint32(4), e = (hi >>> 20) & 0x7ff;
    var m = (BigInt(hi & 0xfffff) << BigInt(32)) | BigInt(lo);
    if (e === 0) e = 1; else m = m | (BigInt(1) << BigInt(52));
    return [(hi >>> 31) ? -m : m, e - 1075];
  }
  function bitLen(n) { return n === BigInt(0) ? 0 : n.toString(2).length; }
  function isqrt(n) {
    if (n < BigInt(2)) return n;
    var x = BigInt(1) << BigInt(Math.ceil(bitLen(n) / 2)), y;
    for (;;) { y = (x + n / x) >> BigInt(1); if (y >= x) break; x = y; }
    while (x * x > n) x -= BigInt(1);
    while ((x + BigInt(1)) * (x + BigInt(1)) <= n) x += BigInt(1);
    return x;
  }
  function sqrtRto(n, m) { var a = isqrt(n / m); return a * a * m !== n ? (a | BigInt(1)) : a; }
  function sqrtFrac(n, m) {  // statistics._float_sqrt_of_frac
    if (n <= BigInt(0)) { if (n === BigInt(0)) return 0.0; n = -n; m = -m; }
    var q = Math.floor((bitLen(n) - bitLen(m) - 109) / 2), num_, den;
    if (q >= 0) { num_ = sqrtRto(n, m << BigInt(2 * q)) << BigInt(q); den = BigInt(1); }
    else { num_ = sqrtRto(n << BigInt(-2 * q), m); den = BigInt(1) << BigInt(-q); }
    return Number(num_) / Number(den);
  }
  function exactStd(a, ddof) {
    var fr = a.map(toFrac), emin = Math.min.apply(null, fr.map(function (f) { return f[1]; }));
    var n = BigInt(a.length), sx = BigInt(0), sxx = BigInt(0);
    fr.forEach(function (f) { var v = f[0] << BigInt(f[1] - emin); sx += v; sxx += v * v; });
    var num_ = n * sxx - sx * sx, den = n * (n - BigInt(ddof));
    if (2 * emin >= 0) num_ = num_ << BigInt(2 * emin); else den = den << BigInt(-2 * emin);
    return sqrtFrac(num_, den);
  }
  function hypot(a, b) {  // correctly rounded √(a² + b²), as math.hypot in Python 3.10+
    if (!isFinite(a) || !isFinite(b)) return Math.hypot(a, b);
    var fa = toFrac(a), fb = toFrac(b), e = Math.min(fa[1], fb[1]);
    var A = fa[0] << BigInt(fa[1] - e), B = fb[0] << BigInt(fb[1] - e), num_ = A * A + B * B, den = BigInt(1);
    if (2 * e >= 0) num_ = num_ << BigInt(2 * e); else den = den << BigInt(-2 * e);
    return sqrtFrac(num_, den);
  }
  function stdev(a) { return exactStd(a, 1); }
  function pstdev(a) { return exactStd(a, 0); }

  function fx(x, n) {  // f"{x:.nf}" - correctly rounded, exact ties to even (like Python)
    if (x !== x) return "nan";
    if (x === Infinity) return "inf";
    if (x === -Infinity) return "-inf";
    var neg = x < 0 || (x === 0 && 1 / x < 0), a = Math.abs(x);
    var s = a.toFixed(n);
    var full = a.toFixed(Math.min(100, n + 25)), dot = full.indexOf(".");
    var rest = full.slice(dot + 1 + n);
    if (/^50*$/.test(rest)) {
      var digits = full.slice(0, dot) + full.slice(dot + 1, dot + 1 + n);
      if (+digits.charAt(digits.length - 1) % 2 === 0) s = n > 0 ? full.slice(0, dot + 1 + n) : full.slice(0, dot);
    }
    return (neg ? "-" : "") + s;
  }
  function fs(x, n) { return ((x > 0 || (x === 0 && 1 / x > 0)) ? "+" : "") + fx(x, n); }  // f"{x:+.nf}"
  function g(x) {  // f"{x:g}"
    if (x !== x) return "nan";

itive terminal; pre-wet until the reading is stable within ±0.02 V for 5 min.", "use": "Wording of the checks for positive / implausible potentials."}, {"ref": "cl. 5.6", "title": "Temperature correction", "text": "Correct when the half-cell is outside 22.2 ± 5.5 °C, about 0.00091 V per °C.", "use": "E(22.2) = E + 0.91 × (T - 22.2) mV when outside the band."}, {"ref": "cl. 6.1.1 Note", "title": "Limits of the numeric criteria", "text": "Not normally used for steel in carbonated concrete, indoor concrete not frequently wetted, highly variable moisture / oxygen, or rehabilitated structures.", "use": "Locations whose carbonation front has reached the steel are flagged."}, {"ref": "cl. 7.1.2", "title": "Repeatability", "text": "Same cell reconnected: within 0.01 V.", "use": "Optional repeat reading checked (> 10 mV warns)."}, {"ref": "Annex A-1.1, A-1.2", "title": "Data presentation", "text": "Equipotential contour map (interval ≤ 0.10 V); cumulative frequency with fx = r / (n + 1) × 100.", "use": "Contour map per member (≥ 4 located points) and cumulative-frequency chart."}]}, {"code": "IS 516 (Part 5/Sec 3):2021", "title": "Carbonation depth test", "status": "Clause numbers taken from the BIS draft (March 2019) of this revision - verify against the official 2021 copy before quoting.", "items": [{"ref": "cl. 2.1", "title": "Carbonation process", "text": "Pore-solution pH falls from about 12.5-13.5 to 8-9, depassivating the steel.", "use": "Front at or beyond the cover → steel depassivated."}, {"ref": "cl. 3.1", "title": "Indicator", "text": "1 % phenolphthalein in ethanol (1 g in 70 ml ethanol + 30 ml de-ionised water).", "use": "Hint when no colour change."}, {"ref": "cl. 3.2 - 3.3", "title": "Measurement", "text": "Freshly broken / split surface; spray a fine mist; measure after the colour stabilises; for an irregular front record the average and maximum depth.", "use": "Average dk and maximum dk,max per location."}, {"ref": "cl. 4.1 - 4.2", "title": "Aggregate and a <script>/* Chart drawing for the web app (Chart.js 4). Each analysis chart spec from ILEngine.run() → one canvas. */
var ILCharts = (function () {
  "use strict";
  var NAVY = "#1f3b73", ORANGE = "#eb6834", GOOD = "#2e9d3a", CRIT = "#d03b3b", GRID = "#e3e3dd";
  var ZONE = {"Excellent": "#d6ecd8", "Good": "#e8f4e9", "Very good": "#d6ecd8", "Doubtful": "#fff2cc", "Fair": "#fff2cc",
    "Poor": "#fbdcdc", "Delaminated": "#f3b9b9", "Low": "#e8f4e9", "Uncertain": "#fff2cc", "High": "#fbdcdc",
    "Severe": "#f3b9b9"};
  var PAL = ["#1f3b73", "#eb6834", "#2e9d3a", "#8e44ad", "#d03b3b", "#2a78d6", "#b7950b", "#16a085", "#7f8c8d", "#c0392b",
    "#34495e", "#e67e22"];
  var live = [];

  function destroyAll() { live.forEach(function (c) { try { c.destroy(); } catch (e) { /* gone */ } }); live = []; }

  // background bands: [{from, to, color, label}] along x (axis 'x') or y
  var bands = {
    id: "bands",
    beforeDatasetsDraw: function (chart, args, opts) {
      if (!opts || !opts.list) return;
      var ctx = chart.ctx, a = chart.chartArea, sc = chart.scales[opts.axis || "x"];
      ctx.save();
      opts.list.forEach(function (b) {
        var p1 = sc.getPixelForValue(Math.max(b.from, sc.min)), p2 = sc.getPixelForValue(Math.min(b.to, sc.max));
        if (!(isFinite(p1) && isFinite(p2))) return;
        ctx.fillStyle = b.color;
        if ((opts.axis || "x") === "x") {
          if (p2 <= p1) return;
          ctx.fillRect(p1, a.top, p2 - p1, a.bottom - a.top);
          ctx.fillStyle = "#555"; ctx.font = "11px Segoe UI"; ctx.textAlign = "center";
          ctx.fillText(b.label || "", (p1 + p2) / 2, a.top + 12);
        } else {
          var t = Math.min(p1, p2), h = Math.abs(p2 - p1);
          ctx.fillRect(a.left, t, a.right - a.left, h);
          ctx.fillStyle = "#555"; ctx.font = "11px Segoe UI"; ctx.textAlign = "right";
          ctx.fillText(b.label || "", a.right - 4, t + h / 2 + 4);
        }
      });
      ctx.restore();
    }
  };
  var labels = {
    id: "ptlabels",
    afterDatasetsDraw: function (chart) {
      var ctx = chart.ctx;
      ctx.save(); ctx.font = "10px Segoe UI"; ctx.fillStyle = "#333";
      chart.data.datasets.forEach(function (ds, i) {
        if (!ds.ptLabels) return;
        chart.getDatasetMeta(i).data.forEach(function (el, j) {
          if (ds.ptLabels[j]) ctx.fillText(ds.ptLabels[j], el.x + 6, el.y - 4);
        });
      });
      ctx.restore();
    }

  // ---- reading the recognised text into rows of a test
  function numTok(t) {  // one token -> number (fixes O/o->0, l/I->1, decimal comma), or null

  // Expected band of a reading for the specified grade: one grade below to one grade above (M25 -> M20 ... M30).
  // Cores: equivalent cube strength. Rebound / UPV: typical correlations (not IS code values - the code gives strength

  var BAND = {

    upv: [[10, 3000], [15, 3300], [20, 3550], [25, 3750], [30, 3950], [35, 4100], [40, 4250], [45, 4380], [50, 4500], [55, 4600], [60, 4700], [70, 4850],
      [80, 5000], [90, 5100], [100, 5200]]

  function bandAt(tab, f) {
    if (f <= tab[0][0]) return tab[0][1];
    for (var i = 0; i < tab.length - 1; i++) {
      if (f <= tab[i + 1][0]) return tab[i][1] + (f - tab[i][0]) * (tab[i + 1][1] - tab[i][1]) / (tab[i + 1][0] - tab[i][0]);

    var g = E.codes.parse_grade(grade);
    if (!isFinite(g)) return ["info", "Enter the specified grade (project or this row) to check the result against one grade below and above."];
    var lo = Math.max(g - 5, 5), hi = g + 5, band = "M" + lo + " - M" + hi, unit, a, b, v = value, txt;
    if (test === "cores") { a = lo; b = hi; unit = " MPa"; txt = "Equivalent cube " + E.fmt.fx(v, 1) + " MPa"; }
    else {
      a = bandAt(BAND[test], lo); b = bandAt(BAND[test], hi);
      unit = test === "upv" ? " m/s" : "";
      txt = (test === "upv" ? "Velocity " + E.fmt.fx(v, 0) + " m/s" : "Rebound number " + E.fmt.fx(v, 1));
    }
    var rng = (test === "upv" ? E.fmt.fx(a, 0) + " - " + E.fmt.fx(b, 0) : E.fmt.fx(a, test === "cores" ? 0 : 1) + " - " + E.fmt.fx(b, test === "cores" ? 0 : 1)) + unit;

      '<span class="right muted small">IS 10262 : 2019 with IS 456 / IS 1343 durability - same calculation as the Windows program.</span></div>' +
      '<div id="ml" style="margin-top:12px"><span class="spin"></span></div>';

      }).join("");

          "<th>w/cm</th><th>Cement (kg/m³)</th><th>Checks</th><th>Saved by</th><th>Date</th></tr>" + rows.map(function (m) {
            var s = m.summary || {}, p = pj[m.project_uid];

              (s.wcm ? fx(s.wcm, 3) : "") + "</td><td>" + (s.opc !== undefined ? fx(s.opc, 0) : "") + "</td><td>" +
              (s.checks_ok === undefined ? "" : (s.checks_ok ? '<span class="chip ok">✔ OK</span>' : '<span class="chip fail">✘ see checks</span>')) +
              "</td><td>" + esc(m.modified_by) + "</td><td>" + esc((m.modified || "").slice(0, 10)) + "</td></tr>";
          }).join("") + "</table></div>" : '<div class="card muted">No mix designs yet - press "+ New mix design".</div>';
        $$("#ml tr.click").forEach(function (tr) { tr.onclick = function () { nav("#/mix/" + tr.dataset.u); }; });
      };

  function mixPage(uid, puid) {
    if (isSuper() && !S.client) return clientsPage();
    if (!mixOn()) return mixListPage();
    var st = {mix: null, projects: [], adv: !!store("il_mix_adv"), tab: "summary", R: null, project_uid: puid || ""};
    main.innerHTML = '<span class="spin"></span>';
    var load = uid && uid !== "new" ? api("mix_get", {uid: uid}) : api("mix_list").then(function (r) { return {mix: null, projects: r.projects}; });
    load.then(function (r) {
      st.mix = r.mix;
      st.projects = r.projects || [];
      var inp = r.mix ? r.mix.inputs || {} : {};
      st.p = Object.assign(mixDefaults(inp.purpose), inp);
      if (r.mix) st.project_uid = r.mix.project_uid || "";
      draw();
    }).catch(fail);

    function draw() {
      var m = st.mix, own = !m || m.can_edit, proj = st.projects.filter(function (x) { return x.uid === st.project_uid; })[0];
      main.innerHTML = '<div class="crumb"><a href="#/mixes">Mix designs</a> ›</div><div class="row"><h1 style="margin:0">' +
        (m ? esc(m.mix_no) + " · " + esc(m.title) : "New concrete mix design") + '</h1><span class="chip">IS 10262 : 2019</span>' +
        (proj ? '<span class="chip">' + esc(proj.code) + "</span>" : "") + '<span class="right"></span>' +
        (own ? '<button class="primary" id="msave">💾 Save</button>' : "") + (m ? '<button id="mcopy">Save as new</button>' : "") +
        (m && own ? '<button class="danger" id="mdel">Delete</button>' : "") + "</div>" +
        (m ? '<p class="small muted">' + esc(m.created_by) + " · last saved by " + esc(m.modified_by) + " " + esc((m.modified || "").slice(0, 16).replace("T", " ")) +
          (own ? "" : " · read only: change the inputs to study the mix, or save your own copy") + "</p>" : "") +
        '<div class="mixwrap" style="margin-top:10px"><div class="card mxin"><div class="row"><h3 style="margin:0">Inputs</h3>' +
        '<label class="right small" style="color:var(--ink);margin:0"><input type="checkbox" id="madv" style="width:auto"' + (st.adv ? " checked" : "") +
        "> Advanced (test values)</label></div><div id=\"mxform\"></div></div><div class=\"mxout\"><div id=\"mxmsg\"></div><div class=\"tabs\" id=\"mtabs\"></div>" +
        '<div id="mxres"></div></div></div>';
      renderForm();
      var form = $("#mxform"), timer = null;
      form.addEventListener("change", function (e) {
        var key = (e.target.id || "").replace("mx_", "");
        if (e.target.tagName === "INPUT" && e.target.type !== "checkbox") return compute();
        var prev = st.p, rd = mixRead(st.p), msg = mixLink(rd.p, key, prev);
        st.p = rd.p;
        if ((key === "ca_type" && !MXO.ca_types[st.p.ca_type]) || (key === "fa_type" && !MXO.fa_types[st.p.fa_type])) { st.adv = true; $("#madv").checked = true; }
        renderForm();
        var el = document.getElementById(e.target.id);
        if (el) el.focus();
        if (msg) toast(msg);
        compute();
      });
      form.addEventListener("input", function (e) {
        if (e.target.tagName !== "INPUT" || e.target.type === "checkbox") return;
        clearTimeout(timer);
        timer = setTimeout(compute, 350);
      });
      $("#madv").onchange = function () {
        st.p = mixRead(st.p).p;
        st.adv = this.checked;
        store("il_mix_adv", st.adv);
        renderForm();
      };
      if ($("#msave")) $("#msave").onclick = function () { saveDlg(false); };
      if ($("#mcopy")) $("#mcopy").onclick = function () { saveDlg(true); };
      if ($("#mdel")) $("#mdel").onclick = function () {
        if (!confirm("Delete mix design " + m.mix_no + "?")) return;
        api("mix_delete", {uid: m.uid}).then(function () { toast("Mix design deleted"); nav("#/mixes"); }).catch(fail);
      };
      compute();
    }
    function renderForm() { $("#mxform").innerHTML = mixFormHtml(st.p, st.adv); }
    function compute() {
      var rd = mixRead(st.p);
      if (rd.bad.length) { $("#mxmsg").innerHTML = lvBox("error", "Check the input: " + rd.bad.join("; ")); st.R = null; return; }
      st.p = rd.p;
      try {
        st.R = ILMix.design(st.p, st.p.quantity || 1.0);
        $("#mxmsg").innerHTML = "";
      } catch (e) {
        st.R = null;
        $("#mxmsg").innerHTML = lvBox("error", "Calculation error: " + (e && e.message || e));
        return;
      }
      showTab();
    }
    function showTab() {
      var tabs = [["summary", "Mix proportions"], ["calc", "Calculation"], ["trials", "Trial mixes"],
        ["qty", mixLab(st.p) ? "Lab batches & casting" : "Site quantities"], ["charts", "Charts"]];
      $("#mtabs").innerHTML = tabs.map(function (t) { return '<a data-t="' + t[0] + '" class="' + (t[0] === st.tab ? "on" : "") + '">' + t[1] + "</a>"; }).join("");
      $$("#mtabs a").forEach(function (a) { a.onclick = function () { st.tab = a.dataset.t; showTab(); }; });
      ILCharts.destroyAll();
      var body = $("#mxres"), R = st.R;
      if (!R) { body.innerHTML = ""; return; }
      if (st.tab === "summary") mixSummaryTab(R, body);
      else if (st.tab === "calc") mixCalcTab(R, body);
      else if (st.tab === "trials") mixTrialsTab(R, body);
      else if (st.tab === "qty") mixQtyTab(R, body);
      else mixChartsTab(R, body);
    }
    function saveDlg(asNew) {
      if (!st.R) return fail("Correct the inputs first");
      var m = st.mix, projs = st.projects.filter(function (x) { return x.file || x.uid === st.project_uid; });
      var pcur = asNew ? "" : st.project_uid;
      var dlg = modal("<h3>" + (asNew || !m ? "Save as a new mix design" : "Save " + esc(m.mix_no)) + '</h3><div class="grid">' +
        field("mtt", "Title", asNew || !m ? mixShort(st.p) : m.title, "text", {cls: "wide"}) +
        '<div class="wide"><label>File under project (optional)</label><select id="mpj"><option value="">- not filed under a project (my mix designs) -</option>' +
        projs.map(function (x) {
          return '<option value="' + esc(x.uid) + '"' + (x.uid === pcur ? " selected" : "") + ">" + esc(x.code) + " · " + esc(x.name) + "</option>";
        }).join("") + "</select></div></div>" +
        '<p class="small muted">The administrator sees every mix design. A mix filed under a project is also seen by users with "Previous data" on that project.</p>' +
        '<div class="row"><button class="primary" id="mok">Save</button><button id="mcx">Cancel</button></div>');
      $("#mcx", dlg).onclick = function () { dlg.remove(); };
      $("#mok", dlg).onclick = function () {
        var b = this;
        busy(b, true);
        api("mix_save", {mix: {uid: asNew || !m ? "" : m.uid, title: val("mtt"), project_uid: val("mpj"), inputs: st.p, volume: st.p.quantity,
          summary: mixSummaryData(st.R)}}).then(function (r) {
          dlg.remove();
          toast("Saved as " + r.mix_no);
          nav("#/mix/" + r.uid);
        }).catch(function (e) { busy(b, false); fail(e); });
      };
    }
  }

      }).join("") + "</table></div><p class=\"small muted\">Moisture: fine aggregate " + gf(R.inputs.moist_fa) + " %, coarse aggregate " +

  function mixCharts(key, R) {
    var p = R.inputs, out = [];
    if (key === "fig_wc" && R.curve) {
      var F1 = ILMix.fig1, w0 = Math.min(Math.max(R.wc_fig, 0.25), 0.65);
      out.push({kind: "xy", heading: "IS 10262 Fig. 1 - free w/c ratio and 28-day strength (Curve " + R.curve + ")", xlabel: "Free water-cement ratio",
        ylabel: "28-day compressive strength (N/mm²)", range: [0.25, 0.65, 10, 80],
        lines: [1, 2, 3].map(function (c) { return {label: "Curve " + c, bold: c === R.curve, pts: F1.wc.map(function (w, i) { return [w, F1.curves[c][i]]; })}; }),
        hlines: [{v: R.ft, label: "target f'ck = " + fx(R.ft, 2) + " N/mm²", color: "#eb6834"}],
        vlines: [{v: R.wc_max, label: "max. w/c for durability = " + fx(R.wc_max, 2), color: "#d03b3b"}],
        points: [{label: "w/c for target strength = " + fx(R.wc_fig, 3), x: w0, y: R.ft, tag: fx(R.wc_fig, 3)},
          {label: "w/c adopted = " + fx(R.wc, 2), x: R.wc, y: ILMix_fig1At(R.curve, R.wc), tag: fx(R.wc, 2), color: "#2e9d3a"}],
        caption: "Interpolated on the adopted curve; the lower of the strength and durability values is adopted (IS 10262 Cl. 5.1)."});
    }
    if (key === "fig_wc" && !R.curve) {
      var agg = p.max_agg, xs = ILMix.WCM_T8_STRENGTH;
      out.push({kind: "xy", heading: "IS 10262 Table 8 - w/cm for high strength concrete", xlabel: "Target strength (N/mm²)", ylabel: "w/cm",
        lines: Object.keys(ILMix.WCM_T8).sort(function (a, b) { return a - b; }).map(function (a) {
          return {label: a + " mm aggregate", bold: Number(a) === agg, marks: true, pts: xs.map(function (x, i) { return [x, ILMix.WCM_T8[a][i]]; })};
        }), points: [{label: "target " + fx(R.ft, 2) + " → w/cm " + fx(R.wc_fig, 3), x: R.ft, y: R.wc_fig, tag: fx(R.wc_fig, 3)}]});
    }
    if (key === "fig_water") {
      out.push({kind: "bars", heading: "Water content build-up (IS 10262 Cl. 5.3)", ylabel: "Water (kg/m³)",
        labels: R.water_build.map(function (w) { return w[0]; }).concat(["Adopted"]),
        values: R.water_build.map(function (w) { return +w[1].toFixed(1); }).concat([R.water]),
        ok: R.water_build.map(function () { return true; }).concat([true]), limits: []});
    }
    if (key === "fig_ca") {
      var T = R.hs ? ILMix.CA_T10 : ILMix.CA_T5, sizes = Object.keys(T).map(Number).sort(function (a, b) { return a - b; });
      var zones = Object.keys(T[sizes[0]]);
      out.push({kind: "xy", heading: "Volume of coarse aggregate per unit volume of total aggregate (" + (R.hs ? "Table 10, w/cm 0.30" : "Table 5, w/c 0.50") + ")",
        xlabel: "Nominal maximum size of aggregate (mm)", ylabel: "Volume of CA",
        lines: zones.map(function (z) { return {label: z, bold: z === p.fa_zone, marks: true, pts: sizes.map(function (s) { return [s, T[s][z]]; })}; }),
        points: [{label: "table value " + fx(R.vca_base, 3), x: p.max_agg, y: R.vca_base, tag: fx(R.vca_base, 3)},
          {label: "corrected for w/cm" + (R.pump_red ? " and pumping" : "") + " = " + fx(R.mix.vca, 4), x: p.max_agg, y: R.mix.vca, tag: fx(R.mix.vca, 3), color: "#2e9d3a"}]});
    }
    if (key === "trials" && R.curve) {
      var pts = R.trials.map(function (t) { return [t.wcm, t.exp]; }).sort(function (a, b) { return a[0] - b[0]; });
      out.push({kind: "xy", heading: "Trial mixes - expected strength from Fig. 1 (plot the actual cube results here)", xlabel: "w/cm", ylabel: "Strength (N/mm²)",
        range: [Math.max(0.2, pts[0][0] - 0.05), Math.min(0.75, pts[pts.length - 1][0] + 0.05), Math.max(0, Math.min(pts[pts.length - 1][1], R.ft) - 10),
          Math.max(pts[0][1], R.ft) + 10],
        lines: [{label: "Trials 3 - 1/2 - 4 (Fig. 1, Curve " + R.curve + ")", marks: true, bold: true, pts: pts}],
        hlines: [{v: R.ft, label: "target f'ck = " + fx(R.ft, 2), color: "#eb6834"}, {v: Number(p.grade), label: "fck = " + p.grade, color: "#888"}]});
    }
    if (key === "volumes") {
      var m = R.mix, parts = [["Air", m.v_air], ["Cement", m.v_c], ["Mineral admixture", m.v_m], ["Silica fume", m.v_sf], ["Water", m.v_w], ["Admixture", m.v_adm],
        ["Fine aggregate", m.v_agg * m.vfa], ["Coarse aggregate", m.v_agg * m.vca]].filter(function (x) { return x[1] > 0; });
      out.push({kind: "bars", heading: "Absolute volumes in 1 m³ of concrete (IS 10262 Cl. 5.7)", ylabel: "Volume (m³)", labels: parts.map(function (x) { return x[0]; }),
        values: parts.map(function (x) { return +x[1].toFixed(4); }), ok: parts.map(function () { return true; }), limits: []});
    }
    return out;
  }
  function ILMix_fig1At(curve, wc) {  // strength on a Fig. 1 curve (for marking the adopted w/c)
    var F1 = ILMix.fig1, xs = F1.wc, ys = F1.curves[curve];
    if (wc <= xs[0]) return ys[0];
    if (wc >= xs[xs.length - 1]) return ys[ys.length - 1];
    for (var i = 0; i < xs.length - 1; i++) if (wc >= xs[i] && wc <= xs[i + 1]) return ys[i] + (wc - xs[i]) * (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
    return ys[0];
  }

  /** Picture from the camera / gallery, made smaller in the browser (long side maxPx, JPEG). */
  function shrinkImage(file, maxPx, quality) {
    return new Promise(function (resolve, reject) {
      var rd = new FileReader();
      rd.onerror = function () { reject({error: "The file could not be read"}); };
      rd.onload = function () {
        var img = new Image();
        img.onerror = function () { reject({error: file.name + " is not a picture"}); };
        img.onload = function () {
          var s = Math.min(1, maxPx / Math.max(img.width, img.height)), cv = document.createElement("canvas");
          cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
          var cx = cv.getContext("2d");
          cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL("image/jpeg", quality || 0.8));
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }
